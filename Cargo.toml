[workspace]
resolver = "3"
members = [
    "crates/bigimage-core",
    "crates/bigimage-ai",
    "crates/bigimage-integrations",
    "crates/bigiris",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
authors = ["Leonardo Athayde <leoathayde@gmail.com>"]
repository = "https://github.com/big-comm/bigiris"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
color-eyre = "0.6"
fast_image_resize = { version = "6", features = ["image"] }
kamadak-exif = "0.6"
# Native image AI engines (BigLinux): plain Rust, CPU or Vulkan GPU, no
# ONNX Runtime. Pinned to a reviewed commit; the weights come from the
# BigLinux packages of the same name (see crates/bigimage-ai).
birefnet-native = { git = "https://github.com/biglinux/image-engine-native", rev = "adbe1784bafd9329c8d667f28759aedfbf841d29" }
realesrgan-native = { git = "https://github.com/biglinux/image-engine-native", rev = "adbe1784bafd9329c8d667f28759aedfbf841d29" }
scunet-native = { git = "https://github.com/biglinux/image-engine-native", rev = "adbe1784bafd9329c8d667f28759aedfbf841d29" }
lama-native = { git = "https://github.com/biglinux/image-engine-native", rev = "adbe1784bafd9329c8d667f28759aedfbf841d29" }
gtk4 = { version = "0.11", features = ["v4_12"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
directories = "5"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
image = { version = "0.25", default-features = false, features = [
    # Tier 1: pure-Rust formats (default in all builds)
    "png",
    "jpeg",
    "webp",
    "tiff",
    "bmp",
    "gif",
    "ico",
    "pnm",
    "tga",
    "qoi",
    "hdr",
    "exr",
    # AVIF: encode via ravif (pure Rust) + decode via dav1d (system lib libdav1d)
    "avif",
    "avif-native",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1

# The AI engines are compute kernels: at opt-level 1 a debug build runs
# them several times slower, which makes the GUI tests that use them crawl.
[profile.dev.package.native-engine]
opt-level = 3
[profile.dev.package.native-vulkan]
opt-level = 3
[profile.dev.package.birefnet-native]
opt-level = 3
[profile.dev.package.realesrgan-native]
opt-level = 3
[profile.dev.package.scunet-native]
opt-level = 3
[profile.dev.package.lama-native]
opt-level = 3

# image 0.25.10 with the AVIF decoder termination fix from upstream
# (image-rs/image@3d74c477). A crafted AVIF without a decodable frame made
# AvifDecoder::new spin forever. Drop this once image > 0.25.10 ships the fix.
[patch.crates-io]
image = { path = "third_party/image" }

[workspace.lints.rust]
deprecated = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.cargo]
unused_dependencies = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
unwrap_used = "deny"
allow_attributes_without_reason = "deny"
unused_result_ok = "warn"
significant_drop_in_scrutinee = "warn"
unchecked_time_subtraction = "warn"
read_zero_byte_vec = "warn"
path_buf_push_overwrite = "warn"
debug_assert_with_mut_call = "warn"
unused_peekable = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
unnecessary_join = "warn"
manual_instant_elapsed = "warn"
large_futures = "warn"
cast_lossless = "warn"
non_std_lazy_statics = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
ignore_without_reason = "warn"
should_panic_without_expect = "warn"
redundant_test_prefix = "warn"
