# BigIris headless batch profile
format = "webp"
# Visual quality to keep: maxima | equilibrado | menor (default equilibrado).
target = "equilibrado"
# Optional fixed encoder quality 1..100 (JPEG/WebP/AVIF); disables the search.
# quality = 85
progressive = false
optimize = false
overwrite = "increment" # skip | replace | increment

# Optional. Without it, outputs are written beside each source image.
# output_dir = "/home/user/Pictures/export"
