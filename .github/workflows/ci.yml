name: CI

on:
  pull_request:
  push:
    branches: [main, 'dev-*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: every job only reads the repository.
# upload-artifact and rust-cache use the runtime token, not GITHUB_TOKEN.
# Third-party actions are pinned to full commit SHAs (tag in the comment);
# rust-toolchain is pinned to a master commit with an explicit `toolchain:`
# because its stable/nightly refs are moving branches.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-headless:
    name: clippy (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # `image` is a non-optional dep with `avif-native` enabled, which
      # pulls dav1d-sys. dav1d is an image codec, not a UI lib, so even
      # the "headless" workspace build needs libdav1d-dev.
      - name: install libdav1d-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdav1d-dev pkg-config bubblewrap util-linux
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  clippy-gui:
    name: clippy (gui + ai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: install GTK4/libadwaita/dav1d dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libdav1d-dev pkg-config bubblewrap util-linux glslc
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

  test:
    name: test (headless)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdav1d-dev pkg-config bubblewrap util-linux gettext locales
          sudo localedef -i pt_BR -f UTF-8 pt_BR.UTF-8
      - name: prepare distro Bubblewrap policy and verify isolation
        run: bash .github/scripts/prepare-sandbox.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Sandbox tests exercise the distro bubblewrap policy and fail closed.
      # Do not disable AppArmor or add broad container capabilities to pass.
      - run: cargo test --workspace --all-targets --locked

  test-gui:
    name: test (gui + ai)
    runs-on: ubuntu-26.04  # libadwaita >= 1.6 (feature v1_6, AdwSpinner)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: install GTK4/libadwaita/dav1d dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libdav1d-dev pkg-config bubblewrap util-linux xvfb dbus-x11 gettext locales glslc
      - name: prepare distro Bubblewrap policy and verify isolation
        run: bash .github/scripts/prepare-sandbox.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Tests in `crates/bigiris/src/gui.rs` (the 20 anchor/zoom tests)
      # only compile with `--features gui`, so they need their own job.
      # Sandbox tests exercise the distro bubblewrap policy and fail closed.
      # Do not disable AppArmor or add broad container capabilities to pass.
      - run: cargo test --workspace --all-features --all-targets --locked

      - name: viewer lifecycle and painted zoom frames (isolated display)
        env:
          GSETTINGS_BACKEND: memory
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          BIGIRIS_TEST_ZOOM_REPORT_DIR: ${{ github.workspace }}/target/quality/ci-zoom
        run: |
          python3 scripts/translations.py compile --destdir "$PWD/target/quality/locale"
          sudo localedef -i fr_FR -f UTF-8 fr_FR.UTF-8
          sudo localedef -i he_IL -f UTF-8 he_IL.UTF-8
          sudo localedef -i pt_BR -f UTF-8 pt_BR.UTF-8
          for language in pt_BR fr he; do
            session_locale=pt_BR.UTF-8
            if [ "$language" = fr ]; then session_locale=fr_FR.UTF-8; fi
            if [ "$language" = he ]; then session_locale=he_IL.UTF-8; fi
            xvfb-run -a dbus-run-session -- env \
              LC_ALL="$session_locale" LANGUAGE="$language" \
              BIGIRIS_LOCALE_DIR="$PWD/target/quality/locale" \
              cargo test -p bigiris --features "gui ai" \
                --locked viewer_lifecycle_releases_state_and_workers -- \
                --ignored --test-threads=1
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: painted-zoom-frames
          path: target/quality/ci-zoom

  build:
    name: build (release, gui + ai)
    runs-on: ubuntu-26.04  # libadwaita >= 1.6 (feature v1_6, AdwSpinner)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: install GTK4/libadwaita/dav1d dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libdav1d-dev pkg-config bubblewrap util-linux glslc
      - name: prepare distro Bubblewrap policy and verify isolation
        run: bash .github/scripts/prepare-sandbox.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `ai` compiles the image-engine-native shaders with glslc; the
      # weights are optional packages, so the binary runs without them.
      - run: cargo build --release --locked --features "gui ai" -p bigiris
      - run: ./target/release/bigiris --self-test

  ai-models:
    name: AI models (BigLinux weights, CPU)
    runs-on: ubuntu-26.04
    env:
      # GitHub runners have no GPU: test the CPU engines.
      IMAGE_ENGINE_NATIVE_GPU: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: install codec dev files and glslc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdav1d-dev pkg-config bubblewrap util-linux glslc zstd
      - name: prepare distro Bubblewrap policy and verify isolation
        run: bash .github/scripts/prepare-sandbox.sh
      # The weights packages, pinned by file name and SHA-256. Bump both
      # together when BigLinux publishes new builds (the repository keeps
      # only current files, so a stale pin fails here, loudly).
      - name: fetch and verify the weights packages
        env:
          REPO: https://packages.biglinux.com.br/biglinux-stable/x86_64
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/weights"
          cd "$RUNNER_TEMP/weights"
          while read -r sum file; do
            curl --fail --proto =https --tlsv1.2 --location --silent --show-error --retry 3 -o "$file" "$REPO/$file"
            echo "$sum  $file" | sha256sum --check --strict
            tar --zstd -xf "$file" usr/share
          done <<'EOF'
          3e17d7ead6e645dc111e5219c2918b22cecc4679618b41e85b221d05d16a6c58 birefnet-native-26.11.08-1835-x86_64.pkg.tar.zst
          b170477088808a4209d7a2946ad7fbaddf93264bf1073240b13e7a20897e6aec realesrgan-native-26.11.08-1835-x86_64.pkg.tar.zst
          8b62c49503c21b1e0b860964962698462076fce602c97c34c06ae2e587a58ed6 scunet-native-26.11.08-1835-x86_64.pkg.tar.zst
          c6175d8da64569e7400b45b5fea5d13ce0d0b14bbd924be1a2fabafc265f16ea lama-native-26.11.08-1835-x86_64.pkg.tar.zst
          EOF
          share="$RUNNER_TEMP/weights/usr/share"
          {
            echo "BIGIRIS_BIREFNET_WEIGHTS=$share/birefnet-native/birefnet-lite-f16.weights"
            echo "BIGIRIS_REALESRGAN_WEIGHTS=$share/realesrgan-native/realesr-general-x4v3-dn50.weights"
            echo "BIGIRIS_SCUNET_WEIGHTS=$share/scunet-native/scunet-color-real-psnr-f16.weights"
            echo "BIGIRIS_LAMA_WEIGHTS=$share/lama-native/big-lama-f16.weights"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: |
          cargo test --release --locked -p bigimage-ai --features native --test models -- \
            --ignored --test-threads=1 --nocapture
      # The CLI end to end, sandboxed decode included.
      - run: |
          cargo test --release --locked -p bigiris --features ai --test cli -- \
            ai_commands --nocapture

  appstream:
    name: AppStream metainfo validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: install appstreamcli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream
      # --no-net skips the URL checks (homepage, bug tracker), which warn
      # while the repository is private; drop it once the repository is public.
      - run: appstreamcli validate --no-net data/com.biglinux.Iris.metainfo.xml

  translations:
    name: 29-language catalogs and localized integration assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
          components: rustfmt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gettext
      - run: python3 scripts/translations.py check --check-generated
      - name: POT matches the sources
        run: |
          bash data/po/regen-pot.sh
          git diff --exit-code -I '^"POT-Creation-Date: ' -I '^#: ' data/po

  desktop:
    name: .desktop validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: install desktop-file-utils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils
      - run: desktop-file-validate data/com.biglinux.Iris.desktop

  licenses:
    name: THIRD_PARTY_LICENSES matches Cargo.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      - run: python3 scripts/third_party_licenses.py --check

  makepkg:
    name: makepkg (Arch container, PKGBUILD.local)
    runs-on: ubuntu-latest
    # Pinned by digest; the job upgrades it with pacman -Syu anyway.
    container: archlinux:latest@sha256:375a401bb3c6376b37f40b6dfa25067db37ec78d0b7af67ae6315f43a0184a9d
    steps:
      - name: install Arch deps
        run: |
          pacman -Syu --noconfirm --needed base-devel rust git sudo namcap
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: chown for builder
        run: chown -R builder:builder .
      # CI builds PKGBUILD.local (the checked-out commit); the shipped
      # PKGBUILD clones the repository. Their declarations must agree.
      - name: compare PKGBUILD and PKGBUILD.local
        run: sudo -u builder bash scripts/compare-pkgbuilds.sh
      # realesrgan-native is a BigLinux package that Arch does not carry, so
      # the dependencies are installed here and makepkg skips its own check.
      - name: install build and runtime dependencies
        working-directory: pkgbuild
        shell: bash
        run: |
          mapfile -t deps < <(sudo -u builder makepkg --printsrcinfo -p PKGBUILD.local |
            sed -n 's/^\t\(make\)\{0,1\}depends = //p' | grep -vx realesrgan-native)
          pacman -S --noconfirm --needed "${deps[@]}"
      # check() probes nested sandbox support, runs all available tests and
      # reports the three functional tests filtered in restricted containers.
      # Host test/build jobs still require full sandbox functionality.
      - name: makepkg
        working-directory: pkgbuild
        run: |
          sudo -u builder PKGEXT=.pkg.tar makepkg \
            -p PKGBUILD.local \
            --noconfirm \
            --nodeps \
            --skipchecksums \
            --skipinteg \
            --clean
      - name: namcap on the built package
        working-directory: pkgbuild
        shell: bash
        # namcap resolves the Nautilus extension's Python modules through the
        # installed tree of its optional dependency nautilus-python.
        run: |
          pacman -S --noconfirm --needed nautilus-python
          namcap bigiris-*.pkg.tar | tee namcap.log
          # namcap wants one file per uncommon license; THIRD_PARTY_LICENSES
          # holds all of their texts in one file.
          ! grep ' E: ' namcap.log | grep -v ' E: Uncommon license identifiers '

  nautilus:
    name: Nautilus extension contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -v
      - run: glib-compile-schemas --strict --dry-run data

  security:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny unsound

  stability:
    name: Synthetic core stress and stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: install codec dev files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdav1d-dev pkg-config bubblewrap util-linux
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p bigimage-core --example quality_probe
      - run: ./target/release/examples/quality_probe stress 32
      - run: ./target/release/examples/quality_probe soak 30

  memcheck:
    name: Core memory errors and leaks (Valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: install codec and debugger files
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdav1d-dev pkg-config bubblewrap util-linux valgrind libc6-dbg
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p bigimage-core --example quality_probe
      - name: instrument synthetic decode/resize/preview/encode cycles
        run: |
          valgrind --leak-check=full --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite,indirect --error-exitcode=1 \
            ./target/release/examples/quality_probe soak 1 320x240

  fuzz:
    name: Codec and ICC fuzzing (ASan + LSan)
    runs-on: ubuntu-latest
    # The repository selects stable in rust-toolchain.toml. Installing
    # nightly alone does not override that choice for the Python runner.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libdav1d-dev pkg-config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-10-16)
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: python3 scripts/fuzz.py --seconds 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fuzz-evidence
          path: |
            target/quality/fuzz
            target/quality/fuzz-artifacts
