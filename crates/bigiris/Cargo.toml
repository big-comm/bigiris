[package]
name = "bigiris"
description = "Fast image viewer and batch converter for Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "bigiris"

[[bin]]
name = "bigiris"
path = "src/main.rs"

[dependencies]
bigimage-core = { path = "../bigimage-core", features = ["serde"] }
bigimage-ai = { path = "../bigimage-ai" }
bigimage-integrations = { path = "../bigimage-integrations" }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
color-eyre.workspace = true
gtk4 = { workspace = true, optional = true }
libadwaita = { workspace = true, optional = true }
# Always-on: remove-bg (CLI + dialog) opens/saves images via `image::open`,
# and the GIF animate path needs it too. Compile cost is shared anyway
# because `bigimage-core` already pulls it in.
image.workspace = true
serde.workspace = true
toml.workspace = true
serde_json = "1"
tempfile = "3"
rustix = { version = "1", features = ["fs"] }
# i18n: libintl wrapper. Always-on (no extra system deps — libintl is in
# glibc on Linux). Translations live under data/po; .mo files are
# compiled by the PKGBUILD and loaded from /usr/share/locale.
gettext-rs = { workspace = true }
# Faster global allocator for the multi-thread batch worker pool. Image
# decode/encode allocates large RGBA buffers per file; the default glibc
# malloc lock-contends across threads, mimalloc trims that off the hot
# path. Trivial integration cost (one `#[global_allocator]` line) and no
# runtime dep — the allocator is statically linked.
mimalloc = { version = "0.1", default-features = false }

[features]
# Off by default so CI and headless builds stay lean (no GTK/libadwaita
# system libs required). The PKGBUILD and README install instructions
# pass `--features "gui ai"` explicitly for end-user installs.
default = []
# Enable AI backend (ORT + models). Requires `onnxruntime` at runtime
# (Arch: `pacman -S onnxruntime`).
ai = ["bigimage-ai/onnx"]
# Enable GTK4 / libadwaita viewer.
gui = ["dep:gtk4", "dep:libadwaita"]
