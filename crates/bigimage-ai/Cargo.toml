[package]
name = "bigimage-ai"
description = "Local image AI for BigIris (native BiRefNet, Real-ESRGAN, SCUNet and LaMa engines, feature-gated)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
bigimage-core = { path = "../bigimage-core" }
thiserror.workspace = true
tracing.workspace = true
image.workspace = true
# getrlimit for the memory admission check (address-space limit).
rustix = { version = "1", features = ["process"] }

# The engines need `glslc` (shaderc) at build time and only `std` +
# the system's libvulkan (opened at run time) afterwards. Weights are
# never downloaded: they come from the BigLinux packages
# birefnet-native, realesrgan-native, scunet-native and lama-native.
birefnet-native = { workspace = true, optional = true }
realesrgan-native = { workspace = true, optional = true }
scunet-native = { workspace = true, optional = true }
lama-native = { workspace = true, optional = true }

[features]
default = []
# Native inference (remove background, upscale, denoise, inpaint).
native = ["dep:birefnet-native", "dep:realesrgan-native", "dep:scunet-native", "dep:lama-native"]
