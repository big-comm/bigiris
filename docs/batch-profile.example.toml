# BigIris headless batch profile
format = "webp"
# Visual quality to keep: maximum | balanced | smallest (default balanced).
target = "balanced"
# Optional fixed encoder quality 1..100 (JPEG/WebP/AVIF); disables the search.
# quality = 85
progressive = false
optimize = false
overwrite = "increment" # skip | replace | increment

# Optional. Without it, outputs are written beside each source image, and a
# folder's image named like another one's output (x.webp or x_1.webp beside
# x.png here) is skipped as an earlier output.
# output_dir = "/home/user/Pictures/export"
